spring:
  application:
    name: car-rental-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/car_rental}
    username: ${DB_USERNAME:carrental}
    password: ${DB_PASSWORD:carrental}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-in-production-1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:3000}
  seed-data: ${APP_SEED_DATA:true}
  booking:
    cancel-free-hours: ${BOOKING_CANCEL_FREE_HOURS:24}